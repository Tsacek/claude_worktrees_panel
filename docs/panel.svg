<svg xmlns="http://www.w3.org/2000/svg" width="880" height="790" viewBox="0 0 880 790" role="img" aria-label="Mockup of the Worktrees pane: worktrees grouped into Needs you, In review, Pushed, Done and Main, with sizes, line counts and next steps">
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 13px; fill: #E8E6DF; }
    .mono { font-family: "Cascadia Mono", SFMono-Regular, Consolas, Menlo, monospace; font-size: 12.5px; }
    .dim { fill: #9C9A92; }
    .small { font-size: 12px; }
    .b { font-weight: 600; }
    .r { text-anchor: end; }
    .btn { fill: #2A2A27; stroke: #4A4A45; }
  </style>

  <rect x="0.5" y="0.5" width="879" height="789" rx="12" fill="#1C1C1A" stroke="#3A3A36"/>

  <!-- title -->
  <text x="24" y="38" class="b" style="font-size:16px">Worktrees</text>
  <text x="856" y="38" class="dim small r">acme/app · base origin/main · updated 2 min ago</text>

  <!-- toolbar -->
  <rect x="24" y="56" width="604" height="30" rx="6" fill="#161614" stroke="#4A4A45"/>
  <text x="36" y="76" class="dim">Search branch, PR or session…</text>
  <rect x="640" y="56" width="104" height="30" rx="6" class="btn"/>
  <text x="692" y="76" style="text-anchor:middle">↻ Refresh</text>
  <rect x="752" y="56" width="104" height="30" rx="6" class="btn"/>
  <text x="804" y="76" style="text-anchor:middle">⇣ Fetch</text>

  <!-- tiles -->
  <rect x="24" y="98" width="832" height="34" rx="6" fill="#2A2A27" stroke="#6A6A64"/>
  <text x="38" y="120"><tspan class="b">10</tspan><tspan class="dim"> worktrees · 186 GB</tspan></text>
  <rect x="24" y="140" width="272" height="40" rx="6" fill="#EF9F2726" stroke="#EF9F2766"/>
  <text x="40" y="165"><tspan fill="#EF9F27">⚑ </tspan><tspan class="b" style="font-size:16px">3</tspan><tspan class="dim">  Need you</tspan></text>
  <rect x="304" y="140" width="272" height="40" rx="6" fill="#378ADD26" stroke="#378ADD66"/>
  <text x="320" y="165"><tspan fill="#378ADD">⇄ </tspan><tspan class="b" style="font-size:16px">2</tspan><tspan class="dim">  In review</tspan></text>
  <rect x="584" y="140" width="272" height="40" rx="6" fill="#1D9E7526" stroke="#1D9E7566"/>
  <text x="600" y="165"><tspan fill="#1D9E75">✓ </tspan><tspan class="b" style="font-size:16px">3</tspan><tspan class="dim">  Can go · 71 GB</tspan></text>

  <!-- disk bar -->
  <rect x="24" y="194" width="233" height="10" rx="2" fill="#EF9F27"/>
  <rect x="258" y="194" width="214" height="10" fill="#378ADD"/>
  <rect x="473" y="194" width="66" height="10" fill="#888780"/>
  <rect x="540" y="194" width="316" height="10" rx="2" fill="#1D9E75"/>
  <text x="24" y="226" class="small"><tspan fill="#EF9F27">■ </tspan><tspan class="dim">needs you 52 GB    </tspan><tspan fill="#378ADD">■ </tspan><tspan class="dim">in review 48 GB    </tspan><tspan fill="#888780">■ </tspan><tspan class="dim">pushed, no PR 15 GB    </tspan><tspan fill="#1D9E75">■ </tspan><tspan class="dim">done, can remove 71 GB</tspan></text>

  <!-- build output -->
  <text x="24" y="258" class="dim">⌫ build output 118 GB in 7 worktrees</text>
  <rect x="270" y="241" width="250" height="26" rx="6" class="btn"/>
  <text x="395" y="258" style="text-anchor:middle">⌫ Clean 5 idle worktrees · 84 GB…</text>

  <!-- status legend -->
