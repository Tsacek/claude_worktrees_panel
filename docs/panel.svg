  <rect x="24" y="335" width="832" height="24" rx="4" fill="#EF9F2714"/>
  <text x="52" y="352" class="dim">▸</text><circle cx="72" cy="347" r="5" fill="#7F77DD"/>
  <text x="86" y="352" class="mono">alex/faster-export</text>
  <text x="660" y="352" class="r mono"><tspan fill="#5DCAA5">+3.6k</tspan><tspan fill="#F0997B"> −4.2k</tspan></text>
  <text x="708" y="352" class="r dim mono">2h</text><text x="772" y="352" class="r dim mono">18 GB</text>
  <text x="846" y="352" class="r mono" fill="#EF9F27">✎ 2</text>

  <rect x="24" y="361" width="832" height="24" rx="4" fill="#EF9F2733"/>
  <text x="52" y="378" class="dim">▸</text><circle cx="72" cy="373" r="5" fill="#EF9F27"/>
  <text x="86" y="378" class="mono">sam/fix-login-timeout</text>
  <rect x="262" y="364" width="22" height="18" rx="4" class="btn"/><text x="273" y="378" style="text-anchor:middle" class="small">↗</text>
  <rect x="288" y="364" width="22" height="18" rx="4" class="btn"/><text x="299" y="378" style="text-anchor:middle" class="small">▤</text>
  <rect x="314" y="364" width="22" height="18" rx="4" class="btn"/><text x="325" y="378" style="text-anchor:middle" class="small">⧉</text>
  <text x="660" y="378" class="r mono"><tspan fill="#5DCAA5">+120</tspan><tspan fill="#F0997B"> −34</tspan></text>
  <text x="708" y="378" class="r dim mono">5m</text><text x="772" y="378" class="r dim mono">9.4 GB</text>
  <text x="846" y="378" class="r mono" fill="#EF9F27">↑ 3</text>

  <rect x="24" y="387" width="832" height="24" rx="4" fill="#EF9F2714"/>
  <text x="52" y="404" class="dim">▸</text><circle cx="72" cy="399" r="5" fill="#D85A30"/>
  <text x="86" y="404" class="mono">alex/csv-import</text>
  <text x="660" y="404" class="r mono"><tspan fill="#5DCAA5">+1.1k</tspan><tspan fill="#F0997B"> −220</tspan></text>
  <text x="708" y="404" class="r dim mono">1d</text><text x="772" y="404" class="r dim mono">25 GB</text>
  <text x="846" y="404" class="r mono" fill="#EF9F27">◷</text>

  <!-- In review -->
  <text x="24" y="442"><tspan fill="#378ADD">⇄ </tspan><tspan class="b">▾ In review</tspan><tspan class="dim">   2 · 48 GB</tspan></text>
  <rect x="24" y="451" width="832" height="24" rx="4" fill="#378ADD14"/>
  <text x="52" y="468" class="dim">▸</text><circle cx="72" cy="463" r="5" fill="#378ADD"/>
  <text x="86" y="468" class="mono">sam/dark-mode</text>
  <text x="660" y="468" class="r mono"><tspan fill="#5DCAA5">+842</tspan><tspan fill="#F0997B"> −97</tspan></text>
  <text x="708" y="468" class="r dim mono">3h</text><text x="772" y="468" class="r dim mono">21 GB</text>

  <rect x="24" y="477" width="832" height="24" rx="4" fill="#378ADD14"/>
  <text x="52" y="494" class="dim">▸</text><circle cx="72" cy="489" r="5" fill="#7F77DD"/>
  <text x="86" y="494" class="mono">robin/cache-layer</text>
  <text x="660" y="494" class="r mono"><tspan fill="#5DCAA5">+2.3k</tspan><tspan fill="#F0997B"> −1.8k</tspan></text>
  <text x="708" y="494" class="r dim mono">2d</text><text x="772" y="494" class="r dim mono">27 GB</text>
  <text x="846" y="494" class="r mono" fill="#EF9F27">⟲ 140</text>

  <!-- Pushed, no PR -->
  <text x="24" y="532"><tspan fill="#888780">↑ </tspan><tspan class="b">▾ Pushed, no PR</tspan><tspan class="dim">   1 · 15 GB</tspan></text>
  <rect x="24" y="541" width="832" height="24" rx="4" fill="#88878014"/>
  <text x="52" y="558" class="dim">▸</text><circle cx="72" cy="553" r="5" fill="#97C459"/>
  <text x="86" y="558" class="mono">robin/docs-refresh</text>
  <text x="660" y="558" class="r mono"><tspan fill="#5DCAA5">+64</tspan><tspan fill="#F0997B"> −12</tspan></text>
  <text x="708" y="558" class="r dim mono">4d</text><text x="772" y="558" class="r dim mono">15 GB</text>
  <text x="846" y="558" class="r mono" fill="#85B7EB">⇄ PR</text>

  <!-- Done, can remove -->
  <text x="24" y="598"><tspan fill="#1D9E75">✓ </tspan><tspan class="b">▾ Done, can remove</tspan><tspan class="dim">   3 · 71 GB</tspan></text>
  <rect x="646" y="583" width="210" height="24" rx="6" fill="#1D9E7533" stroke="#1D9E7599"/>
  <text x="751" y="599" style="text-anchor:middle">✕ Remove all 3 · 71 GB…</text>
  <rect x="24" y="613" width="832" height="24" rx="4" fill="#1D9E7514"/>
  <text x="32" y="630" class="dim">☐</text><text x="52" y="630" class="dim">▸</text><circle cx="72" cy="625" r="5" fill="#1D9E75"/>
  <text x="86" y="630" class="mono">alex/export-format</text>
  <text x="660" y="630" class="r mono"><tspan fill="#5DCAA5">+72</tspan><tspan fill="#F0997B"> −30</tspan></text>
  <text x="708" y="630" class="r dim mono">6d</text><text x="772" y="630" class="r dim mono">40 GB</text>
  <text x="846" y="630" class="r mono" fill="#1D9E75">✓</text>

  <rect x="24" y="639" width="832" height="24" rx="4" fill="#1D9E7514"/>
  <text x="32" y="656" class="dim">☐</text><text x="52" y="656" class="dim">▸</text><circle cx="72" cy="651" r="5" fill="#1D9E75"/>
  <text x="86" y="656" class="mono">sam/retry-policy</text>
  <text x="660" y="656" class="r mono"><tspan fill="#5DCAA5">+210</tspan><tspan fill="#F0997B"> −88</tspan></text>
  <text x="708" y="656" class="r dim mono">9d</text><text x="772" y="656" class="r dim mono">22 GB</text>
  <text x="846" y="656" class="r mono" fill="#1D9E75">✓</text>

  <rect x="24" y="665" width="832" height="24" rx="4" fill="#1D9E7514"/>
  <text x="32" y="682" class="dim">☐</text><text x="52" y="682" class="dim">▸</text><circle cx="72" cy="677" r="5" fill="#E24B4A"/>
  <text x="86" y="682" class="mono">spike-parser</text>
  <text x="708" y="682" class="r dim mono">3w</text><text x="772" y="682" class="r dim mono">9.0 GB</text>
  <text x="846" y="682" class="r mono" fill="#1D9E75">✕</text>

  <!-- Main checkout -->
  <text x="24" y="720"><tspan fill="#B4B2A9">⌂ </tspan><tspan class="b">▾ Main checkout</tspan></text>
  <rect x="24" y="729" width="832" height="24" rx="4" fill="#B4B2A914"/>
  <text x="52" y="746" class="dim">▸</text><circle cx="72" cy="741" r="5" fill="#888780"/>
  <text x="86" y="746" class="mono">main</text>
  <text x="708" y="746" class="r dim mono">1h</text>

  <!-- tooltip of the hovered session button -->
  <rect x="262" y="330" width="214" height="26" rx="5" fill="#F1EFE8"/>
  <text x="272" y="347" style="fill:#2C2C2A" class="small">Open session: Fix login timeout</text>

  <text x="24" y="776" class="dim small">Mockup with made-up data. Pointing at a row shows its Session, Explorer and Copy buttons; hints show their sentence on hover.</text>
</svg>
